[project]
name = "agent-disclosure-fidelity"
version = "0.0.1"
description = "Measures whether an agent's report of what it did matches what it actually did"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shutdown_integrity"]

[tool.ruff]
line-length = 120
