[project]
name = "shutdown-integrity"
version = "0.0.1"
description = "Benchmark for session termination and isolation guarantees in agent runtime SDKs"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shutdown_integrity"]

[tool.ruff]
line-length = 120
